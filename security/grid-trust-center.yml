note: >-
  The security posture and the certification are published in two different places and only
  one of them is linked from the site navigation. The /security page — the page a buyer's
  security team will actually open — never mentions Grid's own SOC 2 Type II. That claim
  lives only in a blog post reachable through the sitemap. A reader who checks /security
  will conclude that only Grid's vendors are SOC 2 certified.
