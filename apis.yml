aid: grid
name: Grid
description: 'Grid (formerly SaaSGrid) is a revenue operations and financial platform that gives
  SaaS finance teams, CFOs, and RevOps a single source of truth for pipeline, billing, ARR,
  retention, revenue, and cash. It connects CRMs, billing systems, and ERPs — including Salesforce,
  HubSpot, NetSuite, QuickBooks, Sage Intacct, and Xero — to automate invoicing and reconciliation,
  produce real-time ARR, NDR, and churn reporting, and power revenue forecasting and scenario
  planning inside shareable dashboards. Surfaced as a portfolio company of craft-ventures,
  kindred-ventures, and obvious-ventures.'
