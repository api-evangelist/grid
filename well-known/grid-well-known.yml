notes: >-
  NOTHING WAS FOUND. No /.well-known/ path on any Grid host returned a real discovery
  document, so NO WellKnown or SecurityTxt pointer is emitted in apis.yml — this file
  records an absence, not a presence.

  Two distinct failure shapes are recorded below and must not be confused.
  (1) withgrid.com / www.withgrid.com are Webflow-hosted and answer every /.well-known/*
  path with HTTP 404 and the body "Invalid .well-known request" — a genuine, unambiguous
  miss. (2) app.withgrid.com and app.saasgrid.com are single-page apps whose catch-all
  serves index.html with HTTP 200 for paths that do not exist, including
  /.well-known/openid-configuration, /.well-known/oauth-authorization-server and
  /.well-known/api-catalog. Those 200s are HTML shells, NOT documents, and are marked
  real: false. Crediting them would be the soft-200 false-credit failure mode.

  api.saasgrid.com (CNAME saasgridapi.com) is the only host that behaves like an API
  origin — it returns a plain, honest 404 page for every path including the root — and it
  serves no well-known document either. Grid's MCP server is OAuth-authenticated
  (mcp/grid-mcp.yml) but publishes no anonymous RFC 8414 authorization-server metadata or
  RFC 9728 protected-resource metadata at any host we could reach, because the MCP URL
  itself is issued per tenant behind the app login.
