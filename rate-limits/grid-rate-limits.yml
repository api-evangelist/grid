description: >-
  ZERO PUBLISHED LIMITS — an honest zero, not an omission. Grid ships one programmatic
  surface, an OAuth-gated remote MCP server (mcp/grid-mcp.yml), and publishes no rate-limit
  documentation for it: no requests-per-second or per-minute figure, no per-tenant or
  per-token quota, no burst allowance, no documented 429 behaviour, and no response headers.
  The MCP setup article covers installation and capabilities only. The pricing page attaches
  no call quota to either tier. There is no developer portal, no API reference, and no
  OpenAPI in which limits could be declared.

  Because the MCP endpoint is issued per tenant behind the app login, no limit could be
  observed on a live unauthenticated response either — an agent integrating with Grid today
  cannot learn the throttle from the docs OR from the wire until it holds credentials.
